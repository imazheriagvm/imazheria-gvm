<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVM Care & Research — Imazheria</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f7fb;
            color:#172033;
            font-size:16px;
        }

        /* SIDEBAR */
        .sidebar{
            position:fixed;
            left:0;
            top:0;
            bottom:0;
            width:260px;
            background:#102a43;
            color:white;
            padding:28px 18px;
            z-index:20;
        }

        .logo{
            font-size:25px;
            font-weight:800;
            margin-bottom:4px;
        }

        .logo-sub{
            font-size:15px;
            color:#b9c8d8;
            margin-bottom:40px;
        }

        .menu{
            display:flex;
            flex-direction:column;
            gap:8px;
        }

        .menu-item{
            padding:14px 16px;
            border-radius:10px;
            color:#dce7f2;
            font-size:17px;
            cursor:pointer;
        }

        .menu-item.active{
            background:#1e4f78;
            color:white;
            font-weight:700;
        }

        .menu-item:hover{
            background:#1b466b;
        }

        .logout{
            position:absolute;
            left:18px;
            right:18px;
            bottom:25px;
            padding:13px 16px;
            border:1px solid #41617c;
            border-radius:10px;
            color:#dce7f2;
            cursor:pointer;
            text-align:center;
            font-size:16px;
        }

        .logout:hover{
            background:#173d5e;
        }

        /* MAIN */
        .main{
            margin-left:260px;
            min-height:100vh;
        }

        .topbar{
            height:74px;
            background:white;
            border-bottom:1px solid #e2e8f0;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 32px;
        }

        .topbar-title{
            font-size:20px;
            font-weight:700;
            color:#102a43;
        }

        .topbar-sub{
            color:#64748b;
            font-size:15px;
        }

        .content{
            padding:30px;
            max-width:1700px;
            margin:auto;
        }

        .page-header{
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            margin-bottom:25px;
        }

        .page-header h1{
            margin:0 0 7px;
            font-size:31px;
            color:#102a43;
        }

        .page-header p{
            margin:0;
            color:#64748b;
            font-size:17px;
        }

        /* STATS */
        .stats{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:18px;
            margin-bottom:25px;
        }

        .stat-card{
            background:white;
            border:1px solid #e2e8f0;
            border-radius:14px;
            padding:20px;
            box-shadow:0 2px 8px rgba(15,23,42,.04);
        }

        .stat-label{
            color:#64748b;
            font-size:16px;
            margin-bottom:8px;
        }

        .stat-value{
            font-size:30px;
            font-weight:800;
            color:#102a43;
        }

        /* LAYOUT */
        .layout{
            display:grid;
            grid-template-columns:390px minmax(0,1fr);
            gap:25px;
            align-items:start;
        }

        .card{
            background:white;
            border:1px solid #e2e8f0;
            border-radius:16px;
            box-shadow:0 3px 12px rgba(15,23,42,.05);
        }

        .card-header{
            padding:21px 22px;
            border-bottom:1px solid #e8edf3;
        }

        .card-header h2{
            margin:0;
            font-size:21px;
            color:#102a43;
        }

        .card-body{
            padding:22px;
        }

        /* FORM */
        .form-group{
            margin-bottom:18px;
        }

        .form-label{
            display:block;
            margin-bottom:8px;
            font-size:16px;
            font-weight:700;
            color:#334155;
        }

        input,
        select{
            width:100%;
            height:49px;
            padding:0 13px;
            border:1px solid #cbd5e1;
            border-radius:9px;
            background:white;
            font-size:17px;
            color:#172033;
            outline:none;
        }

        input:focus,
        select:focus{
            border-color:#3777a8;
            box-shadow:0 0 0 3px rgba(55,119,168,.10);
        }

        .exam-types{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
        }

        .radio-label{
            position:relative;
            cursor:pointer;
        }

        .radio-label input{
            position:absolute;
            opacity:0;
            pointer-events:none;
        }

        .radio-box{
            height:49px;
            border:1px solid #cbd5e1;
            border-radius:9px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:17px;
            font-weight:700;
            color:#475569;
            background:white;
        }

        .radio-label input:checked + .radio-box{
            background:#eaf3fa;
            border-color:#3777a8;
            color:#174a70;
        }

        .contrast-section{
            display:none;
            margin-top:10px;
        }

        .contrast-section.show{
            display:block;
        }

        .contrast-options{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
        }

        .contrast-option{
            height:46px;
            border:1px solid #cbd5e1;
            border-radius:9px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            font-size:16px;
            font-weight:600;
            color:#475569;
        }

        .contrast-option input{
            width:auto;
            height:auto;
            margin-right:7px;
        }

        .btn-save{
            width:100%;
            height:51px;
            margin-top:8px;
            border:none;
            border-radius:10px;
            background:#1e5d88;
            color:white;
            font-size:18px;
            font-weight:700;
            cursor:pointer;
        }

        .btn-save:hover{
            background:#174b70;
        }

        /* AGENDA */
        .agenda-card{
            min-width:0;
        }

        .agenda-header{
            padding:20px 22px;
            border-bottom:1px solid #e8edf3;
        }

        .agenda-top{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
            margin-bottom:18px;
        }

        .agenda-title{
            font-size:23px;
            font-weight:800;
            color:#102a43;
        }

        .agenda-controls{
            display:flex;
            align-items:center;
            gap:8px;
        }

        .day-button{
            width:43px;
            height:43px;
            border:1px solid #cbd5e1;
            background:white;
            border-radius:9px;
            cursor:pointer;
            font-size:22px;
            color:#334155;
        }

        .day-button:hover{
            background:#f1f5f9;
        }

        .selected-date{
            min-width:145px;
            height:43px;
            border:1px solid #cbd5e1;
            border-radius:9px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:17px;
            font-weight:700;
            color:#334155;
            background:#f8fafc;
        }

        /* CALENDAR */
        .calendar{
            border-top:1px solid #e8edf3;
            padding-top:18px;
        }

        .calendar-head{
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-bottom:14px;
        }

        .calendar-month{
            font-size:21px;
            font-weight:800;
            color:#102a43;
            text-transform:capitalize;
        }

        .calendar-nav{
            display:flex;
            gap:7px;
        }

        .calendar-nav button{
            width:37px;
            height:37px;
            border:1px solid #cbd5e1;
            border-radius:8px;
            background:white;
            cursor:pointer;
            font-size:19px;
        }

        .calendar-nav button:hover{
            background:#f1f5f9;
        }

        .calendar-weekdays,
        .calendar-days{
            display:grid;
            grid-template-columns:repeat(7,1fr);
            gap:5px;
        }

        .calendar-weekdays{
            margin-bottom:5px;
        }

        .weekday{
            text-align:center;
            font-size:14px;
            font-weight:700;
            color:#64748b;
            padding:5px 0;
        }

        .calendar-day{
            min-height:46px;
            border:1px solid transparent;
            border-radius:9px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            font-size:16px;
            font-weight:600;
            position:relative;
        }

        .calendar-day:hover{
            background:#eef5fa;
        }

        .calendar-day.other-month{
            color:#b8c1cc;
        }

        .calendar-day.today{
            border-color:#7ba9c8;
            color:#174a70;
            font-weight:800;
        }

        .calendar-day.selected{
            background:#1e5d88;
            color:white;
            font-weight:800;
        }

        .calendar-day.has-appointments::after{
            content:"";
            position:absolute;
            bottom:5px;
            width:5px;
            height:5px;
            border-radius:50%;
            background:#e09b28;
        }

        .calendar-day.selected.has-appointments::after{
            background:white;
        }

        /* SCHEDULE */
        .schedule{
            padding:20px 22px 25px;
        }

        .schedule-info{
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-bottom:15px;
        }

        .schedule-date{
            font-size:20px;
            font-weight:800;
            color:#102a43;
            text-transform:capitalize;
        }

        .schedule-count{
            color:#64748b;
            font-size:16px;
        }

        .time-row{
            display:grid;
            grid-template-columns:76px minmax(0,1fr);
            min-height:65px;
            border-bottom:1px solid #edf1f5;
        }

        .time{
            padding:16px 12px 10px 0;
            color:#64748b;
            font-size:16px;
            font-weight:700;
            text-align:right;
        }

        .slot{
            min-width:0;
            padding:8px 0 8px 14px;
            border-left:1px solid #e2e8f0;
        }

        .empty-slot{
            height:49px;
            border:1px dashed #dbe3eb;
            border-radius:9px;
            display:flex;
            align-items:center;
            padding-left:14px;
            color:#a0acba;
            font-size:15px;
        }

        /* APPOINTMENT */
        .appointment{
            width:100%;
            display:grid;
            grid-template-columns:
                minmax(180px,1.05fr)
                minmax(160px,.85fr)
                minmax(190px,1fr)
                165px
                44px;
            align-items:center;
            gap:14px;
            padding:13px 15px;
            border-radius:12px;
            transition:all .2s ease;
        }

        .appointment.status-waiting{
            background:#fff9e8;
            border:1px solid #ead99b;
        }

        .appointment.status-arrived{
            background:#edf9f3;
            border:1px solid #a9dcc5;
        }

        .appointment.status-finished{
            background:#edf7fc;
            border:1px solid #abd1e4;
        }

        .appointment.status-cancelled{
            background:#fff1f1;
            border:1px solid #e5b8b6;
            opacity:.82;
        }

        .patient-name{
            font-size:18px;
            font-weight:800;
            color:#172033;
            line-height:1.25;
        }

        .patient-phone{
            font-size:16px;
            color:#64748b;
            margin-top:4px;
        }

        .exam-name{
            font-size:17px;
            font-weight:700;
            color:#243b53;
        }

        .exam-meta{
            font-size:15px;
            color:#64748b;
            margin-top:4px;
        }

        .status-select{
            width:100%;
            height:44px;
            border-radius:9px;
            font-size:16px;
            font-weight:700;
            cursor:pointer;
            padding:0 8px;
        }

        .status-select.status-waiting{
            background:#fff5c9;
            border:1px solid #dfc76d;
            color:#795b00;
        }

        .status-select.status-arrived{
            background:#dff4e9;
            border:1px solid #8acaaa;
            color:#17643f;
        }

        .status-select.status-finished{
            background:#dceff8;
            border:1px solid #91c4dd;
            color:#155372;
        }

        .status-select.status-cancelled{
            background:#fbe0df;
            border:1px solid #d99d9a;
            color:#8b2722;
        }

        .delete-btn{
            width:40px;
            height:40px;
            border:1px solid #e1b8b5;
            background:#fff7f7;
            color:#b42318;
            border-radius:8px;
            cursor:pointer;
            font-size:18px;
        }

        .delete-btn:hover{
            background:#fde8e7;
        }

        /* EMPTY */
        .empty-agenda{
            padding:45px 20px;
            text-align:center;
            color:#94a3b8;
            font-size:17px;
        }

        /* TOAST */
        .toast{
            position:fixed;
            right:25px;
            bottom:25px;
            min-width:280px;
            max-width:400px;
            background:#102a43;
            color:white;
            padding:16px 19px;
            border-radius:10px;
            box-shadow:0 8px 25px rgba(0,0,0,.18);
            font-size:16px;
            z-index:100;
            display:none;
        }

        .toast.show{
            display:block;
        }

        /* RESPONSIVE */
        @media(max-width:1250px){
            .layout{
                grid-template-columns:350px minmax(0,1fr);
            }

            .appointment{
                grid-template-columns:
                    minmax(150px,1fr)
                    minmax(130px,1fr)
                    minmax(160px,1fr)
                    145px
                    42px;
            }
        }

        @media(max-width:1050px){
            .sidebar{
                width:220px;
            }

            .main{
                margin-left:220px;
            }

            .layout{
                grid-template-columns:1fr;
            }

            .stats{
                grid-template-columns:repeat(2,1fr);
            }
        }

        @media(max-width:700px){
            .sidebar{
                position:relative;
                width:100%;
                height:auto;
                padding:18px;
            }

            .main{
                margin-left:0;
            }

            .menu{
                flex-direction:row;
                flex-wrap:wrap;
            }

            .logout{
                position:static;
                margin-top:15px;
            }

            .content{
                padding:16px;
            }

            .topbar{
                padding:0 16px;
            }

            .page-header{
                display:block;
            }

            .stats{
                grid-template-columns:1fr 1fr;
                gap:10px;
            }

            .stat-card{
                padding:15px;
            }

            .stat-value{
                font-size:25px;
            }

            .appointment{
                grid-template-columns:1fr;
                gap:8px;
            }

            .delete-btn{
                width:100%;
            }

            .status-select{
                width:100%;
            }

            .calendar-day{
                min-height:40px;
            }

            .calendar-weekdays .weekday{
                font-size:12px;
            }

            .time-row{
                grid-template-columns:58px minmax(0,1fr);
            }

            .time{
                font-size:14px;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">GVM Care</div>
        <div class="logo-sub">Care & Research</div>

        <nav class="menu">
            <div class="menu-item active">📅 Agjenda</div>
            <div class="menu-item">🧲 MRI</div>
            <div class="menu-item">🖥️ CT</div>
            <div class="menu-item">📄 Raporte</div>
        </nav>

        <div class="logout" id="logoutBtn">
            ⇥ Dil
        </div>
    </aside>


    <!-- MAIN -->
    <main class="main">

        <header class="topbar">
            <div class="topbar-title">
                GVM Care & Research
            </div>

            <div class="topbar-sub">
                Departamenti i Imazherisë
            </div>
        </header>


        <div class="content">

            <div class="page-header">
                <div>
                    <h1>Agjenda e Imazherisë</h1>
                    <p>Menaxhoni ekzaminimet MRI dhe CT</p>
                </div>
            </div>


            <!-- STATS -->
            <section class="stats">

                <div class="stat-card">
                    <div class="stat-label">Ekzaminime Sot</div>
                    <div class="stat-value" id="statTotal">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">MRI</div>
                    <div class="stat-value" id="statMRI">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">CT</div>
                    <div class="stat-value" id="statCT">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Përfunduar</div>
                    <div class="stat-value" id="statFinished">0</div>
                </div>

            </section>


            <section class="layout">

                <!-- FORM -->
                <div class="card">

                    <div class="card-header">
                        <h2>Regjistro ekzaminim</h2>
                    </div>

                    <div class="card-body">

                        <form id="appointmentForm">

                            <div class="form-group">
                                <label class="form-label" for="patientName">
                                    Emri i pacientit
                                </label>

                                <input
                                    id="patientName"
                                    type="text"
                                    placeholder="Emri dhe mbiemri"
                                    required
                                >
                            </div>


                            <div class="form-group">
                                <label class="form-label" for="phone">
                                    Telefoni
                                </label>

                                <input
                                    id="phone"
                                    type="text"
                                    placeholder="Numri i telefonit"
                                >
                            </div>


                            <div class="form-group">
                                <label class="form-label" for="appointmentDate">
                                    Data
                                </label>

                                <input
                                    id="appointmentDate"
                                    type="date"
                                    required
                                >
                            </div>


                            <div class="form-group">
                                <label class="form-label" for="appointmentTime">
                                    Ora
                                </label>

                                <select id="appointmentTime" required></select>
                            </div>


                            <div class="form-group">

                                <label class="form-label">
                                    Lloji i ekzaminimit
                                </label>

                                <div class="exam-types">

                                    <label class="radio-label">
                                        <input
                                            type="radio"
                                            name="examType"
                                            value="MRI"
                                        >

                                        <div class="radio-box">
                                            MRI
                                        </div>
                                    </label>


                                    <label class="radio-label">
                                        <input
                                            type="radio"
                                            name="examType"
                                            value="CT"
                                        >

                                        <div class="radio-box">
                                            CT
                                        </div>
                                    </label>

                                </div>
                            </div>


                            <div class="form-group">

                                <label class="form-label" for="examName">
                                    Ekzaminimi
                                </label>

                                <select id="examName" required disabled>
                                    <option value="">
                                        Fillimisht zgjidhni MRI ose CT
                                    </option>
                                </select>

                            </div>


                            <div
                                class="form-group contrast-section"
                                id="contrastSection"
                            >

                                <label class="form-label">
                                    Kontrast
                                </label>

                                <div class="contrast-options">

                                    <label class="contrast-option">
                                        <input
                                            type="radio"
                                            name="contrastType"
                                            value="Me kontrast"
                                        >
                                        Me kontrast
                                    </label>

                                    <label class="contrast-option">
                                        <input
                                            type="radio"
                                            name="contrastType"
                                            value="Pa kontrast"
                                        >
                                        Pa kontrast
                                    </label>

                                </div>

                            </div>


                            <button
                                type="submit"
                                class="btn-save"
                            >
                                + Ruaj ekzaminimin
                            </button>

                        </form>

                    </div>

                </div>


                <!-- AGENDA -->
                <div class="card agenda-card">

                    <div class="agenda-header">

                        <div class="agenda-top">

                            <div class="agenda-title">
                                Agjenda
                            </div>

                            <div class="agenda-controls">

                                <button
                                    class="day-button"
                                    id="previousDay"
                                    type="button"
                                >
                                    ‹
                                </button>

                                <div
                                    class="selected-date"
                                    id="selectedDateLabel"
                                >
                                </div>

                                <button
                                    class="day-button"
                                    id="nextDay"
                                    type="button"
                                >
                                    ›
                                </button>

                            </div>

                        </div>


                        <!-- CALENDAR -->
                        <div class="calendar">

                            <div class="calendar-head">

                                <div
                                    class="calendar-month"
                                    id="calendarMonth"
                                >
                                </div>

                                <div class="calendar-nav">

                                    <button
                                        type="button"
                                        id="previousMonth"
                                    >
                                        ‹
                                    </button>

                                    <button
                                        type="button"
                                        id="todayButton"
                                    >
                                        Sot
                                    </button>

                                    <button
                                        type="button"
                                        id="nextMonth"
                                    >
                                        ›
                                    </button>

                                </div>

                            </div>


                            <div class="calendar-weekdays">

                                <div class="weekday">Hën</div>
                                <div class="weekday">Mar</div>
                                <div class="weekday">Mër</div>
                                <div class="weekday">Enj</div>
                                <div class="weekday">Pre</div>
                                <div class="weekday">Sht</div>
                                <div class="weekday">Die</div>

                            </div>


                            <div
                                class="calendar-days"
                                id="calendarDays"
                            >
                            </div>

                        </div>

                    </div>


                    <div class="schedule">

                        <div class="schedule-info">

                            <div
                                class="schedule-date"
                                id="scheduleDate"
                            >
                            </div>

                            <div
                                class="schedule-count"
                                id="scheduleCount"
                            >
                                0 ekzaminime
                            </div>

                        </div>


                        <div id="scheduleList">
                        </div>

                    </div>

                </div>

            </section>

        </div>

    </main>


    <div
        class="toast"
        id="toast"
    ></div>


<script>
    /* ==============================
       SUPABASE

    /* ==============================

    ============================== */

    function renderCalendar(appointments = []){

        calendarDays.innerHTML = "";

        const year =
            calendarDate.getFullYear();

        const month =
            calendarDate.getMonth();


        calendarMonth.textContent =
            months[month] + " " + year;


        const firstDay =
            new Date(year, month, 1);

        /*
          JS: Sunday = 0
          We want Monday = 0
        */
        let startDay =
            firstDay.getDay() - 1;

        if(startDay < 0){
            startDay = 6;
        }


        const daysInMonth =
            new Date(
                year,
                month + 1,
                0
            ).getDate();


        const previousMonthDays =
            new Date(
                year,
                month,
                0
            ).getDate();


        /*
          Appointment dates for this month
        */
        const appointmentDates =
            new Set(
                appointments.map(
                    a => a.appointment_date
                )
            );


        /*
          Previous month
        */
        for(let i = startDay - 1; i >= 0; i--){

            const dayNumber =
                previousMonthDays - i;

            const date =
                new Date(
                    year,
                    month - 1,
                    dayNumber
                );

            createCalendarDay(
                date,
                true,
                appointmentDates
            );
        }


        /*
          Current month
        */
        for(let day = 1; day <= daysInMonth; day++){

            const date =
                new Date(
                    year,
                    month,
                    day
                );

            createCalendarDay(
                date,
                false,
                appointmentDates
            );
        }


        /*
          Next month
        */
        const totalCells =
            startDay + daysInMonth;

        const remaining =
            Math.ceil(totalCells / 7) * 7
            - totalCells;


        for(let day = 1; day <= remaining; day++){

            const date =
                new Date(
                    year,
                    month + 1,
                    day
                );

            createCalendarDay(
                date,
                true,
                appointmentDates
            );
        }
    }

    function createAppointmentCard(
        appointment

        const currentStatus =
            appointment.status ||

        const statusClass =
            getStatusClass(
                currentStatus
            );


        const card =
            document.createElement("div");

        card.className =
            "appointment " +
            statusClass;


        const patient =
            document.createElement("div");


        patient.innerHTML =
            `<div class="patient-name">
                ${escapeHtml(
                    appointment.patient_name || ""
                )}
             </div>
             <div class="patient-phone">
                ${escapeHtml(
                    appointment.phone || "Pa telefon"
                )}
             </div>`;


        const exam =
            document.createElement("div");


        exam.innerHTML =
            `<div class="exam-name">
                ${escapeHtml(
                    appointment.exam_name || ""
                )}
             </div>
             <div class="exam-meta">
                ${escapeHtml(
                    appointment.exam_type || ""
                )}
                ${
                    appointment.contrast_type
                        ? " · " +
                          escapeHtml(
                              appointment.contrast_type
                          )
                        : ""
                }
             </div>`;


        const statusSelect =
            document.createElement("select");


        statusSelect.className =
            "status-select " +
            statusClass;


        statusSelect.dataset.previousStatus =
            currentStatus;


        [
            STATUS.WAITING,
            STATUS.ARRIVED,
            STATUS.FINISHED,
            STATUS.CANCELLED
        ].forEach(
            function(status){

                const option =
                    document.createElement("option");

                option.value =
                    status;

                option.textContent =
                    status;

                if(
                    status === currentStatus
                ){
                    option.selected = true;
                }

                statusSelect.appendChild(
                    option
                );
            }
        );


        statusSelect.addEventListener(
            "change",
            function(){

                updateAppointmentStatus(
                    appointment.id,
                    statusSelect.value,
                    statusSelect,
                    card
                );
            }
        );


        const deleteButton =
            document.createElement("button");


        deleteButton.type =
            "button";

        deleteButton.className =
            "delete-btn";

        deleteButton.title =
            "Fshi ekzaminimin";

        deleteButton.textContent =
            "🗑";


        deleteButton.addEventListener(
            "click",
            function(){

                deleteAppointment(
                    appointment.id
                );
            }
        );


        card.appendChild(patient);
        card.appendChild(exam);
        card.appendChild(statusSelect);
        card.appendChild(deleteButton);


        return card;
    }


    /* ==============================

    ============================== */

    function escapeHtml(value){

        return String(value)
            .replaceAll("&","&amp;")
            .replaceAll("<","&lt;")
            .replaceAll(">","&gt;")
            .replaceAll('"',"&quot;")
            .replaceAll("'","&#039;");
    }


    /* ==============================
       UPDATE STATUS
    ============================== */

    async function updateAppointmentStatus(
        id,
        newStatus,
        selectElement,
        cardElement
    ){

        const previousStatus =
            selectElement.dataset.previousStatus;


        const result =
            await supabaseClient
                .from("appointments")
                .update({
                    status:newStatus
                })
                .eq("id",id);


        if(result.error){

            console.error(
                result.error
            );

            showToast(
                "Gabim gjatë ndryshimit të statusit."
            );


            selectElement.value =
                previousStatus;


            const oldClass =
                getStatusClass(
                    previousStatus
                );


            selectElement.className =
                "status-select " +
                oldClass;


            cardElement.className =
                "appointment " +
                oldClass;


            return;
        }


        selectElement.dataset.previousStatus =
            newStatus;


        const newClass =
            getStatusClass(
                newStatus
            );


        selectElement.className =
            "status-select " +
            newClass;


        cardElement.className =
            "appointment " +
            newClass;


        showToast(
            "Statusi u ndryshua."
        );


        await loadAppointments();
    }

                calendarDate =
                    new Date(
                        today.getFullYear(),
                        today.getMonth(),
                        1
                    );


                updateDateLabels();

                loadAppointments();
            }
        );


    /* ==============================
       DELETE
    ============================== */

    async function deleteAppointment(id){

        const confirmed =
            confirm(
                "Jeni të sigurt që dëshironi ta fshini këtë ekzaminim?"
            );


        if(!confirmed){
            return;
        }


        const result =
            await supabaseClient
                .from("appointments")
                .delete()
                .eq("id",id);


        if(result.error){

            console.error(
                result.error
            );

            showToast(
                "Gabim gjatë fshirjes."
            );

            return;
        }


        showToast(
            "Ekzaminimi u fshi."
        );


        await loadAppointments();
    }


    /* ==============================
       LOGOUT
    ============================== */

    document
        .getElementById("logoutBtn")
        .addEventListener(
            "click",
            async function(){

                await supabaseClient
                    .auth
                    .signOut();

                window.location.href =
                    "index.html";
            }
        );


    /* ==============================
       SESSION
    ============================== */

    async function checkSession(){

        const result =
            await supabaseClient
                .auth
                .getSession();


        if(!result.data.session){

            window.location.href =
                "index.html";

            return false;
        }


        return true;
    }


    /* ==============================
       INITIALIZE
    ============================== */

    async function init(){

        const authenticated =
            await checkSession();


        if(!authenticated){
            return;
        }


        populateTimes();


        selectedDate =
            new Date();


        calendarDate =
            new Date(
                selectedDate.getFullYear(),
                selectedDate.getMonth(),
                1
            );


        appointmentDate.value =
            formatDateInput(
                selectedDate
            );


        updateDateLabels();


        await loadAppointments();

    }


    init();

</script>

</body>
</html>
